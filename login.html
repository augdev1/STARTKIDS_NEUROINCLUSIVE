<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>StartKids | Entrar ou Criar Conta</title>
  <meta name="description" content="Página de login amigável e segura do StartKids para salvar acessórios e progressão em PostgreSQL.">

  <!-- PWA & Mobile Web App Config -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#162438">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StartKids">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Fontes: PaRappa The Rapper Style + Quicksand Slim + Lexend -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Permanent+Marker&family=Gochi+Hand&family=Quicksand:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos com Cache Buster -->
  <link rel="stylesheet" href="css/style.css?v=19">
  <link rel="stylesheet" href="css/animations.css?v=19">
  <link rel="stylesheet" href="css/login.css?v=19">

  <script>
    // Limpa caches antigos do PWA no mobile imediatamente
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        keys.forEach(function(key) {
          if (key !== 'startkids-cache-v19') caches.delete(key);
        });
      });
    }
  </script>
</head>
<body>
  <!-- Fundo Acolhedor Iluminado -->
  <div class="background-ambient" aria-hidden="true"></div>

  <div class="login-page-wrapper">
    <!-- CARTÃO PRINCIPAL DE LOGIN E CADASTRO -->
    <main class="login-card">
      <div class="login-hero-header">
        <div class="login-card-brand">
          <img src="assets/startkids_logo_card.png" alt="Emblema Árvore e Arco-Íris StartKids" class="login-brand-emblem" width="86" height="77">
          <h1 class="brand-title parappa-logo" aria-label="StartKids">
            <span class="p-letter l-s">S</span><span class="p-letter l-t">t</span><span class="p-letter l-a">a</span><span class="p-letter l-r">r</span><span class="p-letter l-t2">t</span><span class="p-letter l-k">K</span><span class="p-letter l-i">i</span><span class="p-letter l-d">d</span><span class="p-letter l-s">s</span><span class="parappa-tm">™</span>
          </h1>
          <span class="brand-subtitle">Aventuras Educativas & Coleção</span>
        </div>
        <div class="login-speech-bubble" id="loginSpeechBubble">
          Oba! Crie seu perfil mágico com seu nome e uma senha para começarmos nossa jornada!
        </div>
      </div>

      <!-- Abas de Alternância -->
      <div class="login-tabs-container" role="tablist">
        <button class="login-tab-button active" id="tabRegister" role="tab" aria-selected="true" type="button">
          Criar Minha Conta
        </button>
        <button class="login-tab-button" id="tabLogin" role="tab" aria-selected="false" type="button">
          Já Tenho Conta
        </button>
      </div>

      <!-- Formulário de Autenticação -->
      <form class="login-form" id="loginForm" autocomplete="on">
        <!-- Campo Nome de Usuário -->
        <div class="login-input-group">
          <label for="loginUsername" class="login-input-label">
            <span class="login-emoji-icon" aria-hidden="true">👤</span>
            <span>Seu Nome ou Apelido</span>
          </label>
          <div class="login-input-box">
            <input 
              type="text" 
              id="loginUsername" 
              name="username" 
              class="login-input-field" 
              placeholder="Ex: Pedro, Sofia, Lucas..." 
              required 
              minlength="3"
              maxlength="20" 
              autocomplete="username"
              autofocus
            >
          </div>
          <div class="login-input-hint" id="usernameHint" aria-live="polite"></div>
        </div>

        <!-- Campo Senha -->
        <div class="login-input-group">
          <label for="loginPassword" class="login-input-label">
            <span class="login-emoji-icon" aria-hidden="true">🔒</span>
            <span>Sua Senha Mágica</span>
          </label>
          <div class="login-input-box">
            <input 
              type="password" 
              id="loginPassword" 
              name="password" 
              class="login-input-field" 
              placeholder="Mínimo de 4 letrinhas ou números..." 
              required 
              minlength="4"
              maxlength="64" 
              autocomplete="current-password"
            >
            <button type="button" class="btn-toggle-password" id="btnTogglePassword" title="Mostrar ou ocultar senha" aria-label="Mostrar ou ocultar senha">
              👁️
            </button>
          </div>
          <div class="login-input-hint" id="passwordHint" aria-live="polite"></div>
        </div>

        <!-- Área de Mensagem / Feedback Acolhedor -->
        <div class="login-feedback-area" id="loginFeedbackArea" aria-live="polite"></div>

        <!-- Botão de Ação -->
        <button type="submit" class="btn-login-submit" id="btnSubmit">
          <span>Criar Meu Perfil Mágico</span>
          <span class="login-emoji-icon" aria-hidden="true">✨</span>
        </button>

        <!-- Botão de Instalar o App PWA (Alinhado e Centralizado) -->
        <button type="button" class="btn-install-pwa" id="btnInstallPwa" title="Instalar aplicativo no seu computador ou celular">
          <span class="login-emoji-icon" aria-hidden="true">📲</span>
          <span>Instalar Aplicativo (Acesso Rápido)</span>
          <span class="install-pwa-badge">Grátis</span>
        </button>
      </form>

      <!-- Divisor -->
      <div class="login-divider">
        <span>ou</span>
      </div>

      <!-- Botão de Modo Visitante -->
      <button type="button" class="btn-guest-mode" id="btnGuestMode" title="Jogar direto sem criar conta">
        <span class="login-emoji-icon" aria-hidden="true">🎈</span>
        <span>Continuar como Visitante (Sem Salvar na Nuvem)</span>
      </button>

    </main>
  </div>

  <!-- Aprimorador de Emojis Vetoriais (Twemoji) -->
  <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>
  <script src="js/emojiEnhancer.js"></script>

  <!-- PWA & Controlador Modular da Página de Login -->
  <script type="module" src="js/pwaInstaller.js?v=16"></script>
  <script type="module" src="js/login.js?v=16"></script>
</body>
</html>
