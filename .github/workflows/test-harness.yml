name: StarKids Test Harness CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-harness:
    name: Test Harness (APIs, Unit, Security & A11y)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: starkids
          POSTGRES_PASSWORD: starkids_pass
          POSTGRES_DB: starkids_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Validação de Sintaxe
        run: npm run test:syntax

      - name: Executar Test Harness com Cobertura
        env:
          DATABASE_URL: postgres://starkids:starkids_pass@localhost:5433/starkids_db
        run: npm run test:coverage
